<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="dock">
    <button data-app="files" title="Files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 7.5v11a1.5 1.5 0 0 0 1.5 1.5h14a1.5 1.5 0 0 0 1.5-1.5v-9a1.5 1.5 0 0 0-1.5-1.5h-7l-2-2.5H5a1.5 1.5 0 0 0-1.5 1.5z"/></svg>
    </button>
    <button data-app="paint" title="Paint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 5.5c-4.5-2-11-.5-12.5 4C5 14.5 9 16 11 15l-1.5 3.5c2.5 1 5.5-.5 7-3.5C18.5 11.5 20 8 19 5.5z"/><circle cx="9" cy="9.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="14" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>
    </button>
    <button data-app="terminal" title="Terminal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M7.5 10l2.5 2.5L7.5 15M12.5 15h4"/></svg>
    </button>
    <button data-app="browser" title="Browser"><img src="icons/googlechrome.svg" alt=""></button>
    <button data-app="calculator" title="Calculator">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M8.5 7.5h7"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 15.5h.01M12 15.5h.01M15.5 15.5h.01" stroke-width="2.2"/></svg>
    </button>
    <button data-app="instagram" title="Instagram"><img src="icons/instagram.svg" alt=""></button>
    <button data-app="whatsapp" title="WhatsApp"><img src="icons/whatsapp.svg" alt=""></button>
    <button data-app="youtube" title="YouTube"><img src="icons/youtube.svg" alt=""></button>
  </nav>

  <div id="window"></div>

<script src="script.js"></script>
</body>
</html>
